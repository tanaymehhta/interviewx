<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>InterviewX · Call</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ix.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&amp;family=Open+Sans:wght@300;400&amp;display=swap">
<style>body{margin:0}a{color:#2A2826}a:hover{color:#383E28}
.orb{position:relative;width:132px;height:132px;display:grid;place-items:center}
.orb span{position:absolute;inset:0;border-radius:50%;border:1px solid #383E28;animation:ping 2400ms ease-out infinite}
.orb span:nth-child(2){animation-delay:800ms}.orb span:nth-child(3){animation-delay:1600ms}
.orb b{width:56px;height:56px;border-radius:50%;background:#383E28;animation:breathe 1600ms ease-in-out infinite}
.tip{animation:rise 300ms ease-out 3.2s both}
.endc{transition:scale 150ms ease-out}.endc:active{scale:.96}
</style>
</helmet>
<div class="ix" data-theme="light" style="width: 390px; height: 844px; min-height: 0; overflow: hidden; background: var(--ivory); display: flex; flex-direction: column; padding: 28px 24px 36px">
  <div class="rise" style="display: flex; justify-content: space-between; align-items: center">
    <span style="font-size: 13px" class="ink">Salesforce · Final panel</span>
    <span class="num ink" style="font-size: 13px">{{time}}</span>
  </div>
  <p class="eyebrow rise d1" style="padding-top: 28px; color: var(--garnet)">Call · question 2 of 3</p>
  <p class="serif qin" style="font-size: 34px; line-height: 1.15; padding-top: 12px; animation-delay: 200ms">How would you explain a missed forecast to your VP?</p>
  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px">
    <div class="orb" aria-hidden="true"><span></span><span></span><span></span><b></b></div>
    <span class="ink" style="font-size: 14px; font-weight: 400">Listening</span>
  </div>
  <p style="font-size: 16px; line-height: 1.7; color: var(--ink); min-height: 82px">
    <span class="w" style="animation-delay: 0.6s">I’d</span> <span class="w" style="animation-delay: 0.8s">lead</span> <span class="w" style="animation-delay: 1s">with</span> <span class="w" style="animation-delay: 1.15s">the</span> <span class="w" style="animation-delay: 1.3s">number,</span> <span class="w" style="animation-delay: 1.6s">then</span> <span class="w" style="animation-delay: 1.8s">the</span> <span class="w" style="animation-delay: 2s">two</span> <span class="w" style="animation-delay: 2.15s">deals</span> <span class="w" style="animation-delay: 2.3s">that</span> <span class="w interim" style="animation-delay: 2.5s">slipped</span><span class="caret"></span>
  </p>
  <div class="tip card" style="padding: 14px 16px; margin: 8px 0 20px; display: flex; gap: 10px; align-items: center; background: var(--paper)">
    <span class="dot"></span><span class="ink" style="font-size: 14px">Good start. Say what you will do next.</span>
  </div>
  <div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
    <a class="endc" href="Round.dc.html" aria-label="End call" style="width: 76px; height: 76px; border-radius: 50%; background: var(--garnet); display: grid; place-items: center">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.6" aria-hidden="true"><path d="M3 15.5c5-4.6 13-4.6 18 0l-2.2 2.4-3.3-1.4v-2.3a11 11 0 0 0-7 0v2.3l-3.3 1.4z"></path></svg>
    </a>
    <span style="font-size: 13px">End call</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { t: 94 }; }
  componentDidMount() { this.iv = setInterval(() => this.setState({ t: this.state.t + 1 }), 1000); }
  componentWillUnmount() { clearInterval(this.iv); }
  renderVals() {
    const t = this.state.t;
    return { time: String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0') };
  }
}
</script>
</body>
</html>
